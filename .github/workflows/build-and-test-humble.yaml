# .github/workflows/build-and-test-humble.yaml

name: Build ROS2 Humble workspace(and run tests)

on:
  push:
    branches: [humble, gh_workflow_testing]
    paths-ignore:
    - '**/*.md'
    - 'docs/**'
    - 'docker/**'
    - 'documentation/**'
    - 'drivers/**'
    - 'simulation/**'
    - 'LICENSE'
    - '.gitignore'
  pull_request:
    branches: [humble, gh_workflow_testing]
    paths-ignore:
    - '**/*.md'
    - 'docs/**'
    - 'docker/**'
    - 'documentation/**'
    - 'drivers/**'
    - 'simulation/**'
    - 'LICENSE'
    - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    env: 
      ROS_DOMAIN_ID: 1

    steps:
      - uses: actions/checkout@v7
        with: 
            path: colcon_ws/src/${{ github.event.repository.name }}

      - name: Install ROS 2 Humble
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl
          sudo add-apt-repository universe

          export ROS_APT_SOURCE_VERSION=$(
            curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \
            | grep -F "tag_name" \
            | awk -F'"' '{print $4}'
          )

          curl -L -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"

          sudo dpkg -i /tmp/ros2-apt-source.deb

          # GitHub ubuntu-22.04 runners may contain LLVM's versioned
          # libunwind development package, which conflicts with Ubuntu's
          # libunwind-dev required by GStreamer.
          sudo apt-get remove -y \
          libunwind-13-dev \
          libunwind-14-dev \
          libunwind-15-dev || true

          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ros-base \
            ros-dev-tools \
            libunwind-dev

      - name: Check ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ros2 --help


      - name: Get base submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            git submodule update --init external_packages/mqtt_bridge/
            git submodule update --init external_packages/ROS-TCP-Endpoint/


      - name: Get ALARS submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            git submodule update --init messages/psdk_interfaces
            pip install --no-input sympy control transforms3d numpy==1.26.4


      - name: Rosdep
        shell: bash
        working-directory: colcon_ws
        run: |
          sudo apt-get install -y python3-rosdep
          sudo rosdep init
          rosdep update
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src --ignore-src -r -y
          



      - name: Hacky bits of installation for ALARS
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            sudo apt remove -y python3-transforms3d
            pip install --no-input sympy control transforms3d numpy==1.26.4      




      - name: Build workspace
        shell: bash
        working-directory: colcon_ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install


      - name: Setup tmux logging
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}/.github/workflows
        run: |
          tmux start-server \; set-option -g exit-empty off
          tmux set-hook -g after-new-session \
            "run-shell 'log_tmux_pane.sh \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"

          tmux set-hook -g after-new-window \
            "run-shell 'log_tmux_pane.sh \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"

          tmux set-hook -g after-split-window \
            "run-shell 'log_tmux_pane.sh \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"


      - name: Run dji_bringup.sh
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run smarc_bringups dji_bringup.sh M350 15.0 testing
          echo "Waiting for dji_bringup.sh to start..."
          sleep 10
          echo ">>>> ROS NODES"
          ros2 node list

      - name: smarc basics live
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=smarc_basics.yaml -r __ns:=/M350

      - name: dji_captain lives
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=dji_captain.yaml -r __ns:=/M350

      - name: dji basics live
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=dji_basics.yaml -r __ns:=/M350

      - name: alars actions live
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=alars_actions.yaml -r __ns:=/M350

      - name: wasp_bt lives
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=wasp_bt.yaml -r __ns:=/M350

      - name: dji rope swingers live
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=dji_rope_swingers.yaml -r __ns:=/M350

      - name: Print tmux pane output and kill tmux server
        if: always()
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}/.github/workflows
        run: |
          sh print_tmux_logs.sh
          tmux kill-server

          
