# .github/workflows/sam-jazzy.yaml

name: Test SAM Bringup on Jazzy

on:
  push:
    branches: [jazzy, ci/sam-gh-workflow-testing]
    paths:
    - '**/CMakeLists.txt'
    - '**/package.xml'
    - '**/*.cmake'
    - '**/*.c'
    - '**/*.cc'
    - '**/*.cpp'
    - '**/*.cxx'
    - '**/*.h'
    - '**/*.hh'
    - '**/*.hpp'
    - '**/*.hxx'
    - '**/*.msg'
    - '**/*.srv'
    - '**/*.action'
    - '**/*.idl'
    - '.github/workflows/sam-jazzy.yaml'
    - '.gitmodules'
  pull_request:
    branches: [jazzy, ci/sam-gh-workflow-testing]
    paths:
    - '**/CMakeLists.txt'
    - '**/package.xml'
    - '**/*.cmake'
    - '**/*.c'
    - '**/*.cc'
    - '**/*.cpp'
    - '**/*.cxx'
    - '**/*.h'
    - '**/*.hh'
    - '**/*.hpp'
    - '**/*.hxx'
    - '**/*.msg'
    - '**/*.srv'
    - '**/*.action'
    - '**/*.idl'
    - '.github/workflows/sam-jazzy.yaml'
    - '.gitmodules'

jobs:
  sam-jazzy:
    runs-on: ubuntu-24.04
    env: 
      ROS_DOMAIN_ID: 20

    steps:
      - uses: actions/checkout@v7
        with:
          path: colcon_ws/src/${{ github.event.repository.name }}

      - name: Install ROS 2 Jazzy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl

          sudo add-apt-repository universe

          export ROS_APT_SOURCE_VERSION=$(
            curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \
              | grep -F "tag_name" \
              | awk -F'"' '{print $4}'
          )

          curl -L -o /tmp/ros2-apt-source.deb \
          "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"

          sudo dpkg -i /tmp/ros2-apt-source.deb

          sudo apt-get update

          sudo apt-get install -y \
            ros-jazzy-ros-base \
            ros-dev-tools

      - name: Check ROS
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          ros2 wtf

      - name: Get base submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            git submodule update --init external_packages/mqtt_bridge/
            git submodule update --init external_packages/ROS-TCP-Endpoint/

      - name: Get SAM submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            git submodule update --init navigation/dead_reckoning/hydrobatic_localization

      - name: Ignore unrelated packages
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            bash .github/workflows/create_colcon_ignores.sh lolo alars brov evolo proxops tank \
            sbg_ros2_driver smarc_acomms smarc_acomms_client
      
      - name: Rosdep
        shell: bash
        working-directory: colcon_ws
        run: |
          sudo apt install -y python3-rosdep
          sudo rosdep init
          rosdep update
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        shell: bash
        working-directory: colcon_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --continue-on-error --symlink-install