# .github/workflows/activehook-humble.yaml

name: Test ActiveHook Bringup on Humble

on:
  push:
    branches: [humble, activehook_gh_workflow_testing]
    paths:
    - '**/CMakeLists.txt'
    - '**/package.xml'
    - '**/*.cmake'
    - '**/*.c'
    - '**/*.cc'
    - '**/*.cpp'
    - '**/*.cxx'
    - '**/*.h'
    - '**/*.hh'
    - '**/*.hpp'
    - '**/*.hxx'
    - '**/*.msg'
    - '**/*.srv'
    - '**/*.action'
    - '**/*.idl'
    - '.github/workflows/activehook-humble.yaml'
    - '**/*active_hook*/**'
    - '**/*smarc*/**'
  pull_request:
    branches: [humble, activehook_gh_workflow_testing]
    paths:
    - '**/CMakeLists.txt'
    - '**/package.xml'
    - '**/*.cmake'
    - '**/*.c'
    - '**/*.cc'
    - '**/*.cpp'
    - '**/*.cxx'
    - '**/*.h'
    - '**/*.hh'
    - '**/*.hpp'
    - '**/*.hxx'
    - '**/*.msg'
    - '**/*.srv'
    - '**/*.action'
    - '**/*.idl'
    - '.github/workflows/activehook-humble.yaml'
    - '**/*active_hook*/**'
    - '**/*smarc*/**'

jobs:
  activehook-humble:
    runs-on: ubuntu-22.04
    env: 
      ROS_DOMAIN_ID: 1

    steps:
      - uses: actions/checkout@v7
        with: 
            path: colcon_ws/src/${{ github.event.repository.name }}

      - name: Install ROS 2 Humble
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl
          sudo add-apt-repository universe

          export ROS_APT_SOURCE_VERSION=$(
            curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \
            | grep -F "tag_name" \
            | awk -F'"' '{print $4}'
          )

          curl -L -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.jammy_all.deb"

          sudo dpkg -i /tmp/ros2-apt-source.deb

          # GitHub ubuntu-22.04 runners may contain LLVM's versioned
          # libunwind development package, which conflicts with Ubuntu's
          # libunwind-dev required by GStreamer.
          sudo apt-get remove -y \
          libunwind-13-dev \
          libunwind-14-dev \
          libunwind-15-dev || true

          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ros-base \
            ros-dev-tools \
            libunwind-dev

      - name: Check ROS
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ros2 --help


      - name: Get base submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            git submodule update --init external_packages/mqtt_bridge/
            git submodule update --init external_packages/ROS-TCP-Endpoint/


      - name: Get ActiveHook submodules
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            echo "TODO"


      - name: Temp mavros install until it is back in apt...
        shell: bash
        working-directory: colcon_ws/src/
        run: |
            git clone https://github.com/mavlink/mavros.git
            cd mavros
            git checkout 7f7e8fdda872a13755ea3f5814b7a42ac2660eef


      - name: Rosdep
        shell: bash
        working-directory: colcon_ws
        run: |
          sudo apt-get install -y python3-rosdep
          sudo rosdep init
          rosdep update
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths src --ignore-src -r -y
          


      - name: Hacky bits of installation for ActiveHook
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}
        run: |
            sudo apt remove -y python3-transforms3d
            pip install --no-input transforms3d numpy==1.26.4



      - name: Build workspace
        shell: bash
        working-directory: colcon_ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install


      - name: Setup tmux logging
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          tmux start-server \; set-option -g exit-empty off
          LOGGER="$GITHUB_WORKSPACE/colcon_ws/src/${{ github.event.repository.name }}/.github/workflows/log_tmux_pane.sh"
          tmux set-hook -g after-new-session \
            "run-shell '$LOGGER \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"

          tmux set-hook -g after-new-window \
            "run-shell '$LOGGER \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"

          tmux set-hook -g after-split-window \
            "run-shell '$LOGGER \"#{pane_id}\" \"#{session_name}\" \"#{window_index}\" \"#{pane_index}\"'"


      - name: Run active_hook_bringup.sh
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run smarc_bringups active_hook_bringup.sh sim
          echo "Waiting for active_hook_bringup.sh to start..."
          sleep 10
          echo ">>>> ROS NODES"
          ros2 node list

      - name: Active hook captain lives
        shell: bash
        working-directory: colcon_ws
        run: |
          source install/setup.bash
          ros2 run expect_topics expect_topics --ros-args -p timeout_sec:=60.0 -p topics_file:=active_hook_captain.yaml -r __ns:=/ActiveHook



      - name: Print tmux pane output and kill tmux server
        if: always()
        shell: bash
        working-directory: colcon_ws/src/${{ github.event.repository.name }}/.github/workflows
        run: |
          sh print_tmux_logs.sh
          tmux kill-server

          
