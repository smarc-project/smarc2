# This file contains the configuration for the object estimation EKF nodes. 
# In case to estimate a new object, it should be added here with its parameters.
/**:
  ros__parameters:
    classes:
      sam:
        enabled: true
        confidence_threshold: 0.5

        length_m: 1.3
        width_m: 0.16
        motion_model_type: "double_oscillator"
        stale_state_age: 3.0

        environment:
          water_surface_height: 0.0

        parameters:
          gating:
            position_only_fallback: false
          motion:
            sigma_a_xy: 0.03
          measurement_noise:
            R_len: 100.0
            R_wid: 40.0

      buoy:
        enabled: true
        confidence_threshold: 0.5

        length_m: 0.27
        width_m: 0.09
        motion_model_type: "surface"
        stale_state_age: 10.0
        
        environment:
          water_surface_height: 0.0

        parameters:
          gating:
            position_only_fallback: false
          motion:
            sigma_a_xy: 0.01
          measurement_noise:
            R_len: 80.0
            R_wid: 40.0

      land_pad:
        enabled: true
        confidence_threshold: 0.5

        length_m: 1.2
        width_m: 1.2
        # Switch between depth (estimate Z/vZ) and surface (fixed deck Z).
        # Both use flat_rectangle; restart the multi-object EKF after changing.
        motion_model_type: "depth"
        stale_state_age: 3.0

        environment:
          water_surface_height: 1.88 # Map deck Z: equilibrium in depth, fixed in surface.

        parameters:
          measurement:
            geometry: flat_rectangle
          depth:
            # Used only by the depth model.
            sigma_z_process: 1.0
            k_z: 0.4
            d_z: 0.1
          gating:
            position_only_fallback: true
          motion:
            sigma_a_xy: 0.1
          measurement_noise:
            R_len: 30.0
            R_wid: 30.0
